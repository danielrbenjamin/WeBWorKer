<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>WeBWorKer</title>
    <link rel="stylesheet" href="popup.css"/>
    <script src="ext-config.js"></script>
    <script src="spoiler-guard-config.js"></script>
    <script src="spoiler-guard-popup.js"></script>
</head>
<body>
    <div id="popup-container">
        <div class="header">
            <img src="icon/icon48.png" width="32" height="32" alt=""/>
            <div class="header-text">
                <h1>WeBWorKer</h1>
                <a href="https://www.danielrbenjamin.com/" target="_blank" rel="noopener noreferrer">Daniel Benjamin</a>
            </div>
        </div>
        <div class="settings-section">
            <h2 class="section-label">Enable WeBWorKer</h2>
            <div class="setting-item">
                <div class="setting-info">
                    <label class="setting-label" for="enableThisSite">On this site</label>
                </div>
                <label class="switch">
                    <input id="enableThisSite" type="checkbox">
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <label class="setting-label" for="enableGlobal">On all WeBWorK sites</label>
                </div>
                <label class="switch">
                    <input id="enableGlobal" type="checkbox">
                    <span class="slider round"></span>
                </label>
            </div>
        </div>
        <!-- Feature toggles are rendered dynamically by popup.js using ExtConfig.toggleDefinitions -->
        <div id="featureToggles"></div>
        <div class="settings-section panel-section">
            <button id="openSidePanel" class="side-panel-button">
                Open calculator
            </button>
        </div>
        <div class="footer-links">
            <a id="refreshPage" href="#" class="footer-link">Refresh page</a>
            <a id="openOnboarding" href="#" class="footer-link">Help & settings</a>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
