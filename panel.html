<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>WeBWorKer</title>
    <link rel="stylesheet" href="panel.css">
    <script src="panel.js" defer></script>
</head>
<body>
    <header class="panel-header">
        <label class="tool-picker" for="toolSelector"><span>Tools</span>
            <select id="toolSelector" disabled>
                <option value="https://www.desmos.com/scientific">Desmos Scientific</option>
                <option value="https://www.desmos.com/calculator">Desmos Graphing</option>
                <option value="https://www.wolframalpha.com/">Wolfram Alpha</option>
            </select>
        </label>
        <p id="toolStatus" role="status" hidden></p>
    </header>
    <main class="tool-content">
        <iframe class="calculator-frame" id="scientificFrame" title="Desmos Scientific calculator" allow="clipboard-write" hidden></iframe>
        <iframe class="calculator-frame" id="graphingFrame" title="Desmos Graphing calculator" allow="clipboard-write" hidden></iframe>
        <section id="wolframTool" class="wolfram-tool" aria-labelledby="wolfram-heading" hidden>
            <h2 id="wolfram-heading">Wolfram Alpha</h2>
            <form id="wolframForm">
                <label for="wolframQuery">Enter an expression or question</label>
                <textarea id="wolframQuery" rows="4" placeholder="integrate x^2 sin(x)" required></textarea>
                <button type="submit" class="submit-button">Open results</button>
            </form>
            <p>Results open on Wolfram Alpha in a new tab.</p>
        </section>
    </main>
</body>
</html>
